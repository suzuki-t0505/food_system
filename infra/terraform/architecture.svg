<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 830" width="1240" height="830" font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" role="img" aria-label="利用者は HTTPS で外部アプリケーション LB に入り、Cloud Armor を通って Cloud Run の food-vault と food-ship に届く。両サービスとマイグレーション Job は VPC のサブネット経由で Cloud SQL のプライベート IP に接続する。food-ship は VPC 経由で food-vault の在庫 API を呼ぶ。GitHub Actions は Workload Identity 連携でデプロイ用サービスアカウントになり、Artifact Registry への push と Cloud Run の更新を行う。">
  <style>
    .box { fill: #ffffff; stroke: #16242f; stroke-width: 1.4; }
    .zone { fill: #e9eef2; stroke: #b9c4cc; stroke-width: 1.2; }
    .zone2 { fill: none; stroke: #5a6b78; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .ln { fill: none; stroke: #16242f; stroke-width: 1.6; }
    .ln.acc { stroke: #1a5fa8; stroke-width: 2.6; }
    .ln.deny { stroke: #b3470a; stroke-dasharray: 6 5; }
    .ln.dash { stroke: #5a6b78; stroke-dasharray: 5 4; }
    .mk { fill: #16242f; } .mk.acc { fill: #1a5fa8; } .mk.dash { fill: #5a6b78; }
    .t { fill: #16242f; font-size: 12.5px; }
    .h { fill: #16242f; font-size: 14px; font-weight: 700; }
    .s { fill: #5a6b78; font-size: 11.5px; }
    .m { fill: #16242f; font-size: 11.5px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .z { fill: #5a6b78; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
    .ta { fill: #1a5fa8; font-size: 12px; font-weight: 700; }
    .td { fill: #b3470a; font-size: 12px; font-weight: 700; }
  </style>
  <rect width="1240" height="830" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk acc" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk dash" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <!-- zones -->
  <rect class="zone" x="200" y="30" width="1020" height="780" rx="14"/>
  <text class="z" x="218" y="56">GCP プロジェクト</text>

  <rect class="zone2" x="220" y="130" width="250" height="310" rx="10"/>
  <text class="z" x="236" y="152">グローバル</text>

  <rect class="zone2" x="500" y="76" width="700" height="714" rx="10"/>
  <text class="z" x="1184" y="98" text-anchor="end">asia-northeast1</text>

  <rect class="zone2" x="810" y="120" width="370" height="170" rx="10"/>
  <text class="z" x="826" y="142">VPC food-system</text>

  <rect class="zone2" x="810" y="350" width="370" height="170" rx="10"/>
  <text class="z" x="826" y="372">Google 管理のネットワーク</text>

  <!-- outside actors -->
  <rect class="box" x="20" y="180" width="150" height="70" rx="8"/>
  <text class="h" x="95" y="211" text-anchor="middle">利用者</text>
  <text class="s" x="95" y="231" text-anchor="middle">ブラウザ</text>

  <rect class="box" x="20" y="570" width="150" height="80" rx="8"/>
  <text class="h" x="95" y="604" text-anchor="middle">GitHub Actions</text>
  <text class="s" x="95" y="624" text-anchor="middle">dev へのマージで実行</text>

  <!-- global: LB + Armor -->
  <rect class="box" x="240" y="165" width="210" height="110" rx="8"/>
  <text class="h" x="256" y="190">外部アプリケーション LB</text>
  <text class="t" x="256" y="213">固定 IP・443 のみ</text>
  <text class="t" x="256" y="233">マネージド証明書</text>
  <text class="t" x="256" y="253">ホスト名で振り分け</text>

  <rect class="box" x="240" y="310" width="210" height="110" rx="8"/>
  <text class="h" x="256" y="335">Cloud Armor</text>
  <text class="td" x="256" y="358">/api は 403</text>
  <text class="t" x="256" y="378">WAF(OWASP・感度 1)</text>
  <text class="t" x="256" y="398">IP ごとのレート制限</text>
  <line class="ln dash" x1="345" y1="275" x2="345" y2="310"/>
  <text class="s" x="353" y="297">適用</text>

  <!-- region: Cloud Run -->
  <rect class="box" x="530" y="150" width="200" height="80" rx="8"/>
  <text class="s" x="546" y="174">Cloud Run サービス</text>
  <text class="h" x="546" y="197">food-vault(在庫)</text>
  <text class="s" x="546" y="217">ingress: 内部と LB のみ</text>

  <rect class="box" x="530" y="300" width="200" height="80" rx="8"/>
  <text class="s" x="546" y="324">Cloud Run サービス</text>
  <text class="h" x="546" y="347">food-ship(発送)</text>
  <text class="s" x="546" y="367">ingress: 内部と LB のみ</text>

  <rect class="box" x="530" y="440" width="200" height="80" rx="8"/>
  <text class="s" x="546" y="464">Cloud Run Job(マイグレーション)</text>
  <text class="m" x="546" y="486">food-vault-migrate</text>
  <text class="m" x="546" y="505">food-ship-migrate</text>

  <rect class="box" x="530" y="580" width="200" height="70" rx="8"/>
  <text class="h" x="546" y="608">Secret Manager</text>
  <text class="s" x="546" y="630">DB 接続先・署名鍵・トークン</text>

  <rect class="box" x="530" y="700" width="200" height="70" rx="8"/>
  <text class="h" x="546" y="728">Artifact Registry</text>
  <text class="s" x="546" y="750">コンテナイメージ</text>

  <!-- VPC -->
  <rect class="box" x="840" y="165" width="310" height="95" rx="8"/>
  <text class="h" x="856" y="190">サブネット food-system-run</text>
  <text class="m" x="856" y="212">10.10.0.0/24</text>
  <text class="t" x="856" y="236">Private Google Access 有効</text>

  <!-- Cloud SQL -->
  <rect class="box" x="840" y="395" width="310" height="95" rx="8"/>
  <text class="h" x="856" y="420">Cloud SQL(PostgreSQL 15)</text>
  <text class="t" x="856" y="443">プライベート IP のみ・1 ゾーン</text>
  <text class="m" x="856" y="467">DB: food_vault / food_ship</text>

  <!-- IAM -->
  <rect class="box" x="240" y="570" width="210" height="80" rx="8"/>
  <text class="h" x="256" y="598">Workload Identity 連携</text>
  <text class="s" x="256" y="620">リポジトリと dev ブランチを</text>
  <text class="s" x="256" y="636">検証(キーなし)</text>

  <rect class="box" x="240" y="700" width="210" height="70" rx="8"/>
  <text class="h" x="256" y="728">デプロイ用 SA</text>
  <text class="m" x="256" y="750">food-system-deployer</text>

  <!-- user -> LB -->
  <line class="ln" x1="170" y1="215" x2="238" y2="215" marker-end="url(#a)"/>
  <text class="t" x="222" y="206" text-anchor="middle">HTTPS</text>

  <!-- blocked direct access -->
  <polyline class="ln deny" points="95,180 95,108 630,108 630,130"/>
  <line class="ln" style="stroke:#b3470a;stroke-dasharray:none" x1="622" y1="130" x2="638" y2="146"/>
  <line class="ln" style="stroke:#b3470a;stroke-dasharray:none" x1="638" y1="130" x2="622" y2="146"/>
  <text class="td" x="236" y="100">*.run.app への直接アクセスは届かない</text>

  <!-- LB -> services -->
  <line class="ln" x1="450" y1="190" x2="528" y2="190" marker-end="url(#a)"/>
  <text class="s" x="490" y="180" text-anchor="middle">在庫へ</text>
  <polyline class="ln" points="450,250 486,250 486,340 528,340" marker-end="url(#a)"/>
  <text class="s" x="492" y="300">発送へ</text>

  <!-- ship -> vault internal API -->
  <line class="ln acc" x1="630" y1="300" x2="630" y2="233" marker-end="url(#aa)"/>
  <text class="ta" x="640" y="262">在庫 API /api/v1</text>
  <text class="ta" x="640" y="279">VPC 経由(内部扱い)</text>

  <!-- run -> subnet -->
  <line class="ln" x1="730" y1="185" x2="838" y2="185" marker-end="url(#a)"/>
  <polyline class="ln" points="730,340 775,340 775,215 838,215" marker-end="url(#a)"/>
  <polyline class="ln" points="730,480 792,480 792,240 838,240" marker-end="url(#a)"/>
  <text class="s" x="784" y="176" text-anchor="middle">Direct VPC egress</text>

  <!-- subnet -> SQL -->
  <line class="ln" x1="995" y1="260" x2="995" y2="393" marker-end="url(#a)"/>
  <text class="t" x="1005" y="318">VPC ピアリング</text>
  <text class="s" x="1005" y="336">(プライベートサービス接続)</text>

  <!-- secrets -->
  <line class="ln dash" x1="630" y1="580" x2="630" y2="523" marker-end="url(#ad)"/>
  <text class="s" x="640" y="548">サービスと Job が</text>
  <text class="s" x="640" y="563">起動時に参照</text>

  <!-- deploy path -->
  <line class="ln" x1="170" y1="610" x2="238" y2="610" marker-end="url(#a)"/>
  <text class="t" x="222" y="601" text-anchor="middle">OIDC</text>
  <line class="ln" x1="345" y1="650" x2="345" y2="698" marker-end="url(#a)"/>
  <text class="s" x="353" y="680">短命トークン</text>
  <line class="ln" x1="450" y1="745" x2="528" y2="745" marker-end="url(#a)"/>
  <text class="t" x="490" y="737" text-anchor="middle">push</text>
  <polyline class="ln" points="450,720 486,720 486,480 528,480" marker-end="url(#a)"/>
  <text class="s" x="480" y="540" text-anchor="end">Cloud Run の更新</text>
  <text class="s" x="480" y="555" text-anchor="end">Job の実行</text>
</svg>
